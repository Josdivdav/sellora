<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Basic -->
    <title>Sellora</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sellora helps you create a beautiful online store in minutes. Upload products, accept payments, generate invoices, and grow your business without coding."/>
    <meta name="keywords" content="Sellora, ecommerce, online store, website builder, sell online, business, shop, payments, invoice, Nigeria" />
    <meta name="author" content="Sellora" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#2563EB" />
    <!-- Canonical -->
    <link rel="canonical" href="https://selloraa.web.app/" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sellora | Create Your Online Store in Minutes" />
    <meta property="og:description" content="Launch your online business in minutes. Upload products, receive orders, accept payments, and generate invoices automatically." />
    <meta property="og:url" content="https://selloraa.web.app/" />
    <meta property="og:site_name" content="Sellora" />
    <meta property="og:image" content="https://selloraa.web.app/assets/images/favicon.png" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sellora | Create Your Online Store in Minutes" />
    <meta name="twitter:description" content="Start selling online with Sellora. No coding required." />
    <meta name="twitter:image" content="https://selloraa.web.app/assets/images/favicon.png" />
    
    <link rel="apple-touch-icon" href="./assets/images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round">
    <link rel="stylesheet" href="./assets/style.css"/>
    <link rel="icon" href="./assets/images/favico.png"/>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="logo">
          <img src="./assets/images/favico.png" width="35"/>
          <img src="./assets/images/logo-text.png" width="75"/>
          <!-- <h1>Sellora</h1> -->
        </div>
        <div class="search-wrap">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" height="16" class="search-icon">
            <path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Search products…" autocomplete="off"/>
        </div>
        <div class="header-actions">
          <button class="cart-btn" id="cartBtn" aria-label="Cart">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512" height="19">
              <path d="M0 24C0 10.7 10.7 0 24 0L69.5 0c22 0 41.5 12.8 50.6 32l3.5 8H488c14.5 0 27.9 7.8 35.1 20.5s7.1 28.3 0 41L457.5 331.7c-8.7 15.7-25.3 25.6-43.5 25.6H176.8l-8.6 20.7L142.5 424H432c13.3 0 24 10.7 24 24s-10.7 24-24 24H72c-14.6 0-27.9-8.1-34.6-21.1s-5.7-28.8 2.5-40.9L64.6 400 34.6 320.9c-.3-.7-.6-1.4-.9-2.1L1.2 220.9C-2.6 209.5 3.5 197.2 14.9 193.4s23.8 2.4 27.6 13.8L74.3 304H414.1L488 88H142.6l-9.5-24-3.5-8H24C10.7 40 0 27.3 0 24zM128 464a32 32 0 1 1 64 0 32 32 0 1 1 -64 0zm288-32a32 32 0 1 1 0 64 32 32 0 1 1 0-64z"/>
            </svg>
            <span class="cart-badge" id="cartBadge">0</span>
          </button>
          <div class="expand-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" height="20">
              <path d="M0 96C0 78.3 14.3 64 32 64l384 0c17.7 0 32 14.3 32 32s-14.3 32-32 32L32 128C14.3 128 0 113.7 0 96zM0 256c0-17.7 14.3-32 32-32l384 0c17.7 0 32 14.3 32 32s-14.3 32-32 32L32 288c-17.7 0-32-14.3-32-32zM448 416c0 17.7-14.3 32-32 32L32 448c-17.7 0-32-14.3-32-32s14.3-32 32-32l384 0c17.7 0 32 14.3 32 32z"/>
            </svg>
          </div>
        </div>
      </header>

      <main class="main">
        <section class="categories" id="categories" aria-label="Categories"></section>
        <section class="products-section">
          <div class="products-heading">
            <h2 id="resultsTitle">All products</h2>
            <span class="results-count" id="resultsCount"></span>
          </div>
          <div class="products-grid" id="productsGrid"></div>
          <p class="empty-state" id="emptyState" hidden>No products match your search.</p>
        </section>
      </main>
    </div>

    <div class="toast" id="toast"></div>

    <script src="./assets/products.js"></script>
    <script src="./assets/main.js" type="module"></script>
  </body>
</html>
